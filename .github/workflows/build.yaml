name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  FLUTTER_VERSION: '3.38.9'

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Create temporary release signing key
        run: |
          keytool -genkeypair -v \
            -keystore android/app/ci-release.jks \
            -storepass android \
            -keypass android \
            -alias ci-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Fl API Hub CI, OU=Release, O=Fl API Hub, L=Unknown, ST=Unknown, C=US"
          cat > android/key.properties <<'EOF'
          storePassword=android
          keyPassword=android
          keyAlias=ci-release
          storeFile=ci-release.jks
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename release APK
        run: cp build/app/outputs/flutter-apk/app-release.apk fl-api-hub-${{ github.sha }}-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fl-api-hub-apk
          path: fl-api-hub-${{ github.sha }}-release.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: fl-api-hub-${{ github.sha }}-release.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
